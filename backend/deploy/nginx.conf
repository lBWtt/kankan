# ============================================================
# 看看 · 生产 nginx：把 Flutter web 静态包 + 后端 API 放到同一个域名下（同源，零跨域）。
#   /            → Flutter web（SPA，路由回退 index.html）
#   /api/        → 反代后端 8000（前端用相对地址 /api/v1 调用，天然同源）
#   /uploads/    → 反代后端（storage_backend=local 时的媒体；切 OSS 后可删这段）
# HTTPS：配好域名 + 证书后，把 443 server 段解开（见文件尾），并让 80 跳 443。
# ============================================================
server {
    listen 80;
    server_name _;

    # 允许上传较大的图/视频（与后端/前端 80MB 上限对齐，留点余量）
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web 是单页应用：找不到的路径回退到 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端以相对地址 /api/v1/... 调用 → 这里反代到后端容器（同源，无需 CORS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 本地存储的媒体（storage_backend=local）。切阿里云 OSS 后媒体走 OSS 公网域名，这段可删。
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}

