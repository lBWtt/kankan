# ============================================================
# 看看 · 生产 nginx：把 Flutter web 静态包 + 后端 API 放到同一个域名下（同源，零跨域）。
#   /            → Flutter web（SPA，路由回退 index.html）
#   /api/        → 反代后端 8000（前端用相对地址 /api/v1 调用，天然同源）
#   /uploads/    → 反代后端（storage_backend=local 时的媒体；切 OSS 后可删这段）
# HTTPS：配好域名 + 证书后，把 443 server 段解开（见文件尾），并让 80 跳 443。
# ============================================================
# Flutter Web 的 main.dart.js / CanvasKit WASM 体积较大。生产传输必须压缩，
# 否则低带宽 iPhone 首次打开会长时间停在白屏。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/wasm
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # 允许上传较大的图/视频（与后端/前端 80MB 上限对齐，留点余量）
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # APK 分发：手机浏览器下载安装包用（正确 MIME + 强制下载，别被当网页打开）
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # iPhone/桌面 Web App：保留根目录内测落地页，完整 Flutter 应用独立放在 /app/。
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Flutter web 是单页应用：找不到的路径回退到 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # iPhone Web App 暂时与 Android 0.2.2 对齐：Android 当前读取
    # /projects 公共发布流；只把 Apple 浏览器的首页推荐请求改写到同一接口。
    # 这是 Web 入口适配，不改 Android、Flutter 业务代码或后端项目代码。
    location = /api/v1/projects/home-slate {
        if ($http_user_agent ~* "(iPhone|iPad|iPod)") {
            rewrite ^ /api/v1/projects?page_size=10 last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 前端以相对地址 /api/v1/... 调用 → 这里反代到后端容器（同源，无需 CORS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 本地存储的媒体（storage_backend=local）。切阿里云 OSS 后媒体走 OSS 公网域名，这段可删。
    # 媒体是内容寻址文件名（src_<hash>.jpg / avatar_<id>.png），内容不变 → 长缓存 + immutable。
    # 3Mbps 带宽下同一张图只慢第一次，之后走浏览器缓存（问题1-A）。
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 网页审核台（内容比 App 全：审核/运营数据/意见反馈/改马甲）。后端 ADMIN_WEB_ENABLED=1 时提供。
    # 页面使用站内短信管理员登录；refresh token 静默续期 30 天。API 仍由 admin_required 鉴权。
    location /admin-web/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── HTTPS：lovluu.com（备案已下来）。证书由 certbot 签，Let's Encrypt 目录挂到 /etc/nginx/certs ──
# 注意：上面的 80 段（server_name _）故意保留，让老的裸 IP HTTP APK 仍能用 + 供 certbot ACME 续期挑战。
# 等所有用户都换成指向 https://lovluu.com 的新包后，可把 80 改成 301 跳 443。
server {
    listen 443 ssl;
    http2 on;
    server_name lovluu.com www.lovluu.com;

    ssl_certificate     /etc/nginx/certs/live/lovluu.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lovluu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # iPhone Web App 与 Android 0.2.2 共用公开发布流；仅做入口层改写。
    location = /api/v1/projects/home-slate {
        if ($http_user_agent ~* "(iPhone|iPad|iPod)") {
            rewrite ^ /api/v1/projects?page_size=10 last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /admin-web/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
