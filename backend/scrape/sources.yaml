# ============================================================
# 这个文件是干什么的：**内容源登记册**——把"帮我们筛好项目的博主/网站/清单"统一存起来。
#   站(website/directory/awesome_list/newsletter) 和 号(x_account) 一起管，不再混淆。
# 为什么要它：与其人肉记几个源，不如把"自己去发现同类源并存起来"这件事固化成流程——
#   `discover_sources` 跑固定搜索 + 行为分析，把新发现的源以 status: proposed 追加到本文件；
#   人在审核台/命令行确认后翻成 confirmed；采集器**只从 confirmed 拉**。换任何 AI 跑都一样。
# 谁读它：各 collector（ph/x/hellogithub/...）读 confirmed 的同类源；discover_sources 写 proposed。
#
# ── 字段 schema ─────────────────────────────────────────────
#   name        显示名（站名 / @handle）
#   kind        website | directory | awesome_list | newsletter | x_account
#   url         站类必填（首页/repo/RSS）
#   handle      x_account 必填（不带 @）
#   lang        zh | en
#   focus       ai-tools | indie-products | github-projects | devtools | mixed
#                 —— 供评分/配额用：偏成品(indie-products/ai-tools)优先，偏基建(github-projects)次之
#   region_hint cn | us | global   —— 只是提示；真正的国区/美区可达以解析 try_url 为准
#   scrapable   rss | repo_md | html | x_timeline | x_search   —— 将来写 collector 用哪种解析
#   status      seed | confirmed | proposed | rejected   —— 采集器只认 confirmed(含 seed)
#   found_by    manual | websearch:YYYY-MM-DD | behavior | list:<handle>
#   note        备注（偏科/坑/优先级等）
#
# ── 状态流转 ─────────────────────────────────────────────
#   discover_sources → 新源写 proposed → 人确认 → confirmed（或 rejected，下次不再提名）。
#   seed = 初始手工种子，等价 confirmed。
# ============================================================

sources:
