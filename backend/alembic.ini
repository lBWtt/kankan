# NOTE: ASCII only in this file. Python's configparser reads it with the OS
# locale encoding (GBK on Chinese Windows), so non-ASCII text breaks alembic.
# Plain-language description of this file lives in README.md.
# What it does: config for Alembic, the DB migration tool (where scripts live, logging).
# DB URL is NOT set here - alembic/env.py reads it from env vars / .env via app.core.config.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
